<svg xmlns="http://www.w3.org/2000/svg" width="900" height="512" viewBox="0 0 900 512" role="img" aria-label="The side-free control: base and the three single changes"><title>The side-free control: base and the three single changes</title><rect width="900" height="512" rx="14" fill="#f4f7fa"/><g font-family="Segoe UI, sans-serif"><text x="28" y="42" font-size="25" fill="#15314b">The side-free control: base and the three single changes</text><text x="35" y="90" font-size="20" fill="#15314b">Candidate</text><text x="430" y="90" font-size="20" fill="#15314b">Cost</text><text x="535" y="90" font-size="20" fill="#15314b">Automorphisms</text><text x="745" y="90" font-size="20" fill="#15314b">Separates?</text><text x="35" y="141" font-size="20" fill="#15314b">Base</text><text x="446" y="141" font-size="20" fill="#15314b">0</text><text x="575" y="141" font-size="20" fill="#15314b">2</text><text x="762" y="141" font-size="20" fill="#15314b">no</text><text x="35" y="200" font-size="20" fill="#15314b">Keep identical labels</text><text x="446" y="200" font-size="20" fill="#15314b">1</text><text x="575" y="200" font-size="20" fill="#15314b">2</text><text x="762" y="200" font-size="20" fill="#15314b">no</text><text x="35" y="259" font-size="20" fill="#15314b">Add one identical mark</text><text x="446" y="259" font-size="20" fill="#15314b">1</text><text x="575" y="259" font-size="20" fill="#15314b">6</text><text x="762" y="259" font-size="20" fill="#15314b">no</text><text x="35" y="318" font-size="20" fill="#15314b">Permit only identity</text><text x="446" y="318" font-size="20" fill="#15314b">1</text><text x="575" y="318" font-size="20" fill="#15314b">1</text><text x="762" y="318" font-size="20" fill="#15314b">yes</text><text x="35" y="413" font-size="21" fill="#15314b">Minimum: 1 changed coordinate, at the declared two-mark case.</text><text x="35" y="449" font-size="19" fill="#15314b">Exclude identity-only solutions: none of these eligible candidates satisfies.</text><text x="35" y="483" font-size="19" fill="#15314b">This is a finite menu and a declared price, not a universal cost of orientation.</text></g></svg>
