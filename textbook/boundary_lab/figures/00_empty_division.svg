<svg xmlns="http://www.w3.org/2000/svg" width="900" height="408" viewBox="0 0 900 408" role="img" aria-label="An empty placement list does not remove the admitted division"><title>An empty placement list does not remove the admitted division</title><rect width="900" height="408" rx="14" fill="#f4f7fa"/><g font-family="Segoe UI, sans-serif"><text x="28" y="42" font-size="25" fill="#15314b">An empty placement list does not remove the admitted division</text><rect x="28" y="72" width="414" height="205" rx="10" fill="white" stroke="#bdd0df"/><text x="46" y="105" font-size="20" fill="#15314b">U — unnamed</text><text x="56" y="153" font-size="20" fill="#15314b">side 0</text><text x="276" y="153" font-size="20" fill="#15314b">side 1</text><path d="M235 122 V190" stroke="#335f7e" stroke-width="3"/><text x="56" y="190" font-size="20" fill="#15314b">no marks</text><text x="276" y="190" font-size="20" fill="#15314b">no marks</text><text x="46" y="228" font-size="20" fill="#15314b">Equal side profiles: yes</text><text x="46" y="257" font-size="20" fill="#15314b">Holding judgments: 0</text><rect x="470" y="72" width="414" height="205" rx="10" fill="white" stroke="#bdd0df"/><text x="488" y="105" font-size="20" fill="#15314b">O — named</text><text x="498" y="153" font-size="20" fill="#15314b">side 0</text><text x="718" y="153" font-size="20" fill="#15314b">side 1</text><path d="M677 122 V190" stroke="#335f7e" stroke-width="3"/><text x="498" y="190" font-size="20" fill="#15314b">no marks</text><text x="718" y="190" font-size="20" fill="#15314b">no marks</text><text x="488" y="228" font-size="20" fill="#15314b">Equal side profiles: no</text><text x="488" y="257" font-size="20" fill="#15314b">Holding judgments: 2</text><text x="28" y="318" font-size="20" fill="#15314b">U: no visible side names. O: admitted names near and far.</text><text x="28" y="351" font-size="18" fill="#15314b">The labels 0 and 1 let us describe the model; they do not name U sides internally.</text><text x="28" y="382" font-size="18" fill="#15314b">This division is an admitted seed exception, not the Path lab boundary operation.</text></g></svg>
