<svg xmlns="http://www.w3.org/2000/svg" width="900" height="442" viewBox="0 0 900 442" role="img" aria-label="Equal answers survive an exchange; unequal answers do not"><title>Equal answers survive an exchange; unequal answers do not</title><rect width="900" height="442" rx="14" fill="#f4f7fa"/><g font-family="Segoe UI, sans-serif"><text x="28" y="42" font-size="25" fill="#15314b">Equal answers survive an exchange; unequal answers do not</text><text x="35" y="88" font-size="20" fill="#15314b">Report: (answer for x,y; answer for y,x)</text><text x="555" y="88" font-size="20" fill="#15314b">Swap preserves it?</text><text x="50" y="134" font-size="24" fill="#15314b">(no, no)</text><text x="575" y="134" font-size="24" fill="#166454">YES</text><text x="50" y="192" font-size="24" fill="#15314b">(yes, yes)</text><text x="575" y="192" font-size="24" fill="#166454">YES</text><text x="50" y="250" font-size="24" fill="#15314b">(no, yes)</text><text x="575" y="250" font-size="24" fill="#a83f31">NO</text><text x="50" y="308" font-size="24" fill="#15314b">(yes, no)</text><text x="575" y="308" font-size="24" fill="#a83f31">NO</text><text x="35" y="378" font-size="21" fill="#15314b">For a family of reports, every selected row must pass.</text><text x="35" y="414" font-size="21" fill="#15314b">No selected reports: none can block the swap.</text></g></svg>
