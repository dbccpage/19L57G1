<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-label="A represented growth step with old and new demands shown separately">
<rect width="820" height="400" fill="#fafbf7"/>
<text x="20" y="35" font-family="sans-serif" font-size="20" fill="#19322c">Held items</text>
<text x="240" y="35" font-family="sans-serif" font-size="20" fill="#19322c">0, 1, 2, 3</text>
<text x="20" y="80" font-family="sans-serif" font-size="20" fill="#19322c">Views</text>
<text x="240" y="80" font-family="sans-serif" font-size="20" fill="#19322c">{0,1} ; {1,2}</text>
<text x="20" y="125" font-family="sans-serif" font-size="20" fill="#19322c">Commitment</text>
<text x="240" y="125" font-family="sans-serif" font-size="20" fill="#19322c">total</text>
<text x="20" y="170" font-family="sans-serif" font-size="20" fill="#19322c">Old demands</text>
<text x="240" y="170" font-family="sans-serif" font-size="20" fill="#19322c">none</text>
<text x="20" y="215" font-family="sans-serif" font-size="20" fill="#19322c">New item</text>
<text x="240" y="215" font-family="sans-serif" font-size="20" fill="#19322c">4</text>
<text x="20" y="260" font-family="sans-serif" font-size="20" fill="#19322c">New demands</text>
<text x="240" y="260" font-family="sans-serif" font-size="20" fill="#19322c">4/3</text>
<text x="20" y="305" font-family="sans-serif" font-size="20" fill="#19322c">All demands after</text>
<text x="240" y="305" font-family="sans-serif" font-size="20" fill="#19322c">4/3</text>
<text x="20" y="375" font-family="sans-serif" font-size="18" fill="#19322c">The same views remain; growth adds no observation or repair.</text>
</svg>
