<svg xmlns="http://www.w3.org/2000/svg" width="900" height="447" viewBox="0 0 900 447" role="img" aria-label="Two one-item replies, two different effects on C"><title>Two one-item replies, two different effects on C</title><rect width="900" height="447" rx="14" fill="#f4f7fa"/><g font-family="Segoe UI, sans-serif"><text x="28" y="42" font-size="25" fill="#15314b">Two one-item replies, two different effects on C</text><rect x="28" y="75" width="268" height="222" rx="10" fill="white" stroke="#bdd0df"/><text x="44" y="108" font-size="21" fill="#15314b">Before</text><text x="138" y="144" font-size="20" fill="#15314b">P</text><text x="223" y="144" font-size="20" fill="#15314b">Q</text><text x="53" y="185" font-size="23" fill="#15314b">A</text><text x="138" y="185" font-size="20" fill="#15314b">yes</text><text x="223" y="185" font-size="20" fill="#15314b">yes</text><text x="53" y="228" font-size="23" fill="#15314b">B</text><text x="138" y="228" font-size="20" fill="#15314b">yes</text><text x="223" y="228" font-size="20" fill="#15314b">—</text><text x="53" y="271" font-size="23" fill="#15314b">C</text><text x="138" y="271" font-size="20" fill="#15314b">—</text><text x="223" y="271" font-size="20" fill="#15314b">—</text><rect x="316" y="75" width="268" height="222" rx="10" fill="white" stroke="#bdd0df"/><text x="332" y="108" font-size="21" fill="#15314b">Add Q(B)</text><text x="426" y="144" font-size="20" fill="#15314b">P</text><text x="511" y="144" font-size="20" fill="#15314b">Q</text><text x="341" y="185" font-size="23" fill="#15314b">A</text><text x="426" y="185" font-size="20" fill="#15314b">yes</text><text x="511" y="185" font-size="20" fill="#15314b">yes</text><text x="341" y="228" font-size="23" fill="#15314b">B</text><text x="426" y="228" font-size="20" fill="#15314b">yes</text><text x="511" y="228" font-size="20" fill="#15314b">yes</text><text x="341" y="271" font-size="23" fill="#15314b">C</text><text x="426" y="271" font-size="20" fill="#15314b">—</text><text x="511" y="271" font-size="20" fill="#15314b">—</text><rect x="604" y="75" width="268" height="222" rx="10" fill="white" stroke="#bdd0df"/><text x="620" y="108" font-size="21" fill="#15314b">Rule Q on every card</text><text x="714" y="144" font-size="20" fill="#15314b">P</text><text x="799" y="144" font-size="20" fill="#15314b">Q</text><text x="629" y="185" font-size="23" fill="#15314b">A</text><text x="714" y="185" font-size="20" fill="#15314b">yes</text><text x="799" y="185" font-size="20" fill="#15314b">yes</text><text x="629" y="228" font-size="23" fill="#15314b">B</text><text x="714" y="228" font-size="20" fill="#15314b">yes</text><text x="799" y="228" font-size="20" fill="#15314b">yes</text><text x="629" y="271" font-size="23" fill="#15314b">C</text><text x="714" y="271" font-size="20" fill="#15314b">—</text><text x="799" y="271" font-size="20" fill="#15314b">yes</text><text x="28" y="341" font-size="22" fill="#15314b">Both replies cost one item. Only the rule changes C.</text><text x="28" y="381" font-size="21" fill="#15314b">C still differs from A and B on P. All three positions remain.</text><text x="28" y="419" font-size="19" fill="#15314b">yes = derivable here; — = not derivable here</text></g></svg>
