<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="A tie at this step can change the next price"><title>A tie at this step can change the next price</title><rect width="900" height="440" rx="14" fill="#f4f7fa"/><g font-family="Segoe UI, sans-serif"><text x="28" y="42" font-size="25" fill="#15314b">A tie at this step can change the next price</text><text x="28" y="88" font-size="20" fill="#15314b">First reply</text><text x="390" y="88" font-size="20" fill="#15314b">First items</text><text x="552" y="88" font-size="20" fill="#15314b">Next items</text><text x="729" y="88" font-size="20" fill="#15314b">Total items</text><text x="35" y="158" font-size="23" fill="#15314b">Q(B)</text><text x="430" y="158" font-size="25" fill="#15314b">1</text><text x="594" y="158" font-size="25" fill="#15314b">2</text><text x="777" y="158" font-size="25" fill="#15314b">3</text><text x="35" y="248" font-size="23" fill="#15314b">Uniform rule Q</text><text x="430" y="248" font-size="25" fill="#15314b">1</text><text x="594" y="248" font-size="25" fill="#15314b">1</text><text x="777" y="248" font-size="25" fill="#15314b">2</text><text x="28" y="327" font-size="21" fill="#15314b">First match A and B; then keep that requirement and match A and C.</text><text x="28" y="370" font-size="21" fill="#15314b">Both paths use two reply rounds. Their item totals differ.</text><text x="28" y="410" font-size="19" fill="#15314b">These are selected continuations, not a general rule about future cost.</text></g></svg>
