<svg xmlns="http://www.w3.org/2000/svg" width="900" height="422" viewBox="0 0 900 422" role="img" aria-label="Keep both old promises with three additions"><title>Keep both old promises with three additions</title><rect width="900" height="422" rx="14" fill="#f4f7fa"/><g font-family="Segoe UI, sans-serif"><text x="28" y="42" font-size="25" fill="#15314b">Keep both old promises with three additions</text><text x="28" y="91" font-size="22" fill="#15314b">1. New one-place form S</text><text x="28" y="133" font-size="22" fill="#15314b">2. Uniform rule for arrows</text><text x="28" y="175" font-size="22" fill="#15314b">3. Single instance S(C)</text><text x="505" y="91" font-size="20" fill="#15314b">Card</text><text x="590" y="91" font-size="20" fill="#15314b">Every arrow test</text><text x="807" y="91" font-size="20" fill="#15314b">S</text><text x="521" y="137" font-size="23" fill="#15314b">A</text><text x="644" y="137" font-size="20" fill="#15314b">yes</text><text x="808" y="137" font-size="20" fill="#15314b">—</text><text x="521" y="190" font-size="23" fill="#15314b">B</text><text x="644" y="190" font-size="20" fill="#15314b">yes</text><text x="808" y="190" font-size="20" fill="#15314b">—</text><text x="521" y="243" font-size="23" fill="#15314b">C</text><text x="644" y="243" font-size="20" fill="#15314b">yes</text><text x="808" y="243" font-size="20" fill="#15314b">yes</text><text x="28" y="308" font-size="22" fill="#15314b">A and B match; C stays distinguishable from both.</text><text x="28" y="351" font-size="22" fill="#15314b">Valid reply: yes. Within the two-item search: no.</text><text x="28" y="392" font-size="19" fill="#15314b">The three data positions remain. This is an exhibited reply outside the bound.</text></g></svg>
