<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Add coordinates first, then apply the weight rule"><title>Add coordinates first, then apply the weight rule</title><rect width="900" height="470" rx="14" fill="#f4f7fa"/><g font-family="Segoe UI, sans-serif"><text x="28" y="42" font-size="25" fill="#15314b">Add coordinates first, then apply the weight rule</text><text x="28" y="94" font-size="22" fill="#15314b">First input is (1, 0) in every row. Weight of (x, y) = x² + y².</text><text x="28" y="148" font-size="21" fill="#15314b">Second input</text><text x="254" y="148" font-size="21" fill="#15314b">Separate weights</text><text x="509" y="148" font-size="21" fill="#15314b">Input sum</text><text x="736" y="148" font-size="21" fill="#15314b">Reading</text><text x="58" y="208" font-size="25" fill="#15314b">(1, 0)</text><text x="311" y="208" font-size="25" fill="#15314b">(1, 1)</text><text x="538" y="208" font-size="25" fill="#15314b">(2, 0)</text><text x="772" y="208" font-size="28" fill="#15314b">4</text><text x="58" y="274" font-size="25" fill="#15314b">(0, 1)</text><text x="311" y="274" font-size="25" fill="#15314b">(1, 1)</text><text x="538" y="274" font-size="25" fill="#15314b">(1, 1)</text><text x="772" y="274" font-size="28" fill="#15314b">2</text><text x="58" y="340" font-size="25" fill="#15314b">(−1, 0)</text><text x="311" y="340" font-size="25" fill="#15314b">(1, 1)</text><text x="538" y="340" font-size="25" fill="#15314b">(0, 0)</text><text x="772" y="340" font-size="28" fill="#15314b">0</text><text x="28" y="397" font-size="22" fill="#15314b">Right + right gives 4. Right + up gives 2. Right + left gives 0.</text><text x="28" y="439" font-size="20" fill="#15314b">These are squared scores, not distances or measured probabilities.</text></g></svg>
