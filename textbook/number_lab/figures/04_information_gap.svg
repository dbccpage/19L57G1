<svg xmlns="http://www.w3.org/2000/svg" width="900" height="537" viewBox="0 0 900 537" role="img" aria-label="A conflicting output blocks recovery from the weights"><title>A conflicting output blocks recovery from the weights</title><rect width="900" height="537" rx="14" fill="#f4f7fa"/><g font-family="Segoe UI, sans-serif"><text x="28" y="42" font-size="25" fill="#15314b">A conflicting output blocks recovery from the weights</text><text x="28" y="100" font-size="21" fill="#15314b">Recorded input</text><text x="360" y="100" font-size="21" fill="#15314b">Required reading</text><text x="652" y="100" font-size="21" fill="#15314b">Preparation</text><text x="81" y="158" font-size="27" fill="#15314b">(1, 1)</text><text x="439" y="158" font-size="28" fill="#15314b">4</text><text x="708" y="158" font-size="25" fill="#15314b">A</text><text x="81" y="222" font-size="27" fill="#15314b">(1, 1)</text><text x="439" y="222" font-size="28" fill="#15314b">2</text><text x="708" y="222" font-size="25" fill="#15314b">B</text><text x="81" y="286" font-size="27" fill="#15314b">(1, 1)</text><text x="439" y="286" font-size="28" fill="#15314b">0</text><text x="708" y="286" font-size="25" fill="#15314b">C</text><text x="28" y="384" font-size="22" fill="#15314b">Only weights: 1 signature class.</text><text x="28" y="425" font-size="22" fill="#15314b">Weights plus reading: 3 signature classes.</text><text x="28" y="467" font-size="21" fill="#15314b">No lookup seeing only (1, 1) can return all three required answers.</text><text x="28" y="506" font-size="19" fill="#15314b">The allowed carrier here is A, B, C. The class count is not a bit count.</text></g></svg>
