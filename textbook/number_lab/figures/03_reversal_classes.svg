<svg xmlns="http://www.w3.org/2000/svg" width="900" height="492" viewBox="0 0 900 492" role="img" aria-label="Reversal groups limit the distinct readings"><title>Reversal groups limit the distinct readings</title><rect width="900" height="492" rx="14" fill="#f4f7fa"/><g font-family="Segoe UI, sans-serif"><text x="28" y="42" font-size="25" fill="#15314b">Reversal groups limit the distinct readings</text><rect x="28" y="78" width="414" height="250" rx="10" fill="white" stroke="#bdd0df"/><text x="46" y="115" font-size="24" fill="#15314b">4 positions</text><text x="57" y="160" font-size="25" fill="#15314b">{0}</text><text x="57" y="205" font-size="25" fill="#15314b">{1, 3}</text><text x="57" y="250" font-size="25" fill="#15314b">{2}</text><text x="234" y="206" font-size="22" fill="#15314b">At most 3</text><text x="234" y="244" font-size="22" fill="#15314b">readings</text><rect x="470" y="78" width="414" height="250" rx="10" fill="white" stroke="#bdd0df"/><text x="488" y="115" font-size="24" fill="#15314b">5 positions</text><text x="499" y="160" font-size="25" fill="#15314b">{0}</text><text x="499" y="205" font-size="25" fill="#15314b">{1, 4}</text><text x="499" y="250" font-size="25" fill="#15314b">{2, 3}</text><text x="676" y="206" font-size="22" fill="#15314b">At most 3</text><text x="676" y="244" font-size="22" fill="#15314b">readings</text><text x="28" y="378" font-size="21" fill="#15314b">Every pair in one group must share its reading under the reversal rule.</text><text x="28" y="420" font-size="21" fill="#15314b">Dropping that rule can allow a different answer at every position.</text><text x="28" y="461" font-size="19" fill="#15314b">A group-label reading attains the bound; a chosen physical formula needs more.</text></g></svg>
