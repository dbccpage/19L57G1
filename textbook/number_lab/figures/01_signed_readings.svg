<svg xmlns="http://www.w3.org/2000/svg" width="900" height="441" viewBox="0 0 900 441" role="img" aria-label="The same weights can hide a sign that matters later"><title>The same weights can hide a sign that matters later</title><rect width="900" height="441" rx="14" fill="#f4f7fa"/><g font-family="Segoe UI, sans-serif"><text x="28" y="42" font-size="25" fill="#15314b">The same weights can hide a sign that matters later</text><text x="28" y="95" font-size="21" fill="#15314b">Signed inputs</text><text x="290" y="95" font-size="21" fill="#15314b">Separate squares</text><text x="589" y="95" font-size="21" fill="#15314b">Add, then square</text><text x="48" y="158" font-size="28" fill="#15314b">(1, 1)</text><text x="340" y="158" font-size="28" fill="#15314b">(1, 1)</text><text x="688" y="158" font-size="30" fill="#15314b">4</text><text x="48" y="238" font-size="28" fill="#15314b">(1, −1)</text><text x="340" y="238" font-size="28" fill="#15314b">(1, 1)</text><text x="688" y="238" font-size="30" fill="#15314b">0</text><text x="28" y="323" font-size="22" fill="#15314b">Square first, then add: 1 + 1 = 2 in both rows.</text><text x="28" y="367" font-size="22" fill="#15314b">Add first, then square: the signs can change the reading.</text><text x="28" y="410" font-size="19" fill="#15314b">The readout operation is supplied. The separate weights do not choose it.</text></g></svg>
