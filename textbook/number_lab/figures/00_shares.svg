<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416" role="img" aria-label="Double every count; keep the same shares"><title>Double every count; keep the same shares</title><rect width="900" height="416" rx="14" fill="#f4f7fa"/><g font-family="Segoe UI, sans-serif"><text x="28" y="42" font-size="25" fill="#15314b">Double every count; keep the same shares</text><text x="28" y="100" font-size="23" fill="#15314b">(2, 3); total 5</text><rect x="28" y="119" width="29" height="29" rx="4" fill="#276b9e"/><rect x="65" y="119" width="29" height="29" rx="4" fill="#276b9e"/><rect x="102" y="119" width="29" height="29" rx="4" fill="#d2dde7"/><rect x="139" y="119" width="29" height="29" rx="4" fill="#d2dde7"/><rect x="176" y="119" width="29" height="29" rx="4" fill="#d2dde7"/><text x="28" y="220" font-size="23" fill="#15314b">(4, 6); total 10</text><rect x="28" y="239" width="29" height="29" rx="4" fill="#276b9e"/><rect x="65" y="239" width="29" height="29" rx="4" fill="#276b9e"/><rect x="102" y="239" width="29" height="29" rx="4" fill="#276b9e"/><rect x="139" y="239" width="29" height="29" rx="4" fill="#276b9e"/><rect x="176" y="239" width="29" height="29" rx="4" fill="#d2dde7"/><rect x="213" y="239" width="29" height="29" rx="4" fill="#d2dde7"/><rect x="250" y="239" width="29" height="29" rx="4" fill="#d2dde7"/><rect x="287" y="239" width="29" height="29" rx="4" fill="#d2dde7"/><rect x="324" y="239" width="29" height="29" rx="4" fill="#d2dde7"/><rect x="361" y="239" width="29" height="29" rx="4" fill="#d2dde7"/><text x="464" y="106" font-size="22" fill="#15314b">Left position cross check</text><text x="464" y="151" font-size="24" fill="#15314b">2 × 10 = 4 × 5 = 20</text><text x="464" y="222" font-size="22" fill="#15314b">Right position cross check</text><text x="464" y="267" font-size="24" fill="#15314b">3 × 10 = 6 × 5 = 30</text><text x="28" y="342" font-size="22" fill="#15314b">Blue counts the left tray. Both left shares are 2/5 = 4/10.</text><text x="28" y="385" font-size="19" fill="#15314b">Equal proportions can forget a doubled total. Both totals here are positive.</text></g></svg>
