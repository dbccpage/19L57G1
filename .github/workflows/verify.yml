name: verify

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Prompt byte-identity
        run: python ci/check_prompt_hashes.py
      - name: Transport document citations bound to Lean sources
        run: python ci/check_transport_citations.py
      # Skills are apparatus and hold no authority here. The declaration is
      # checked mechanically because prose drifts: a skill cannot acquire
      # authority by rewording its own description. This gate checks the
      # DECLARATION and the SHAPE, never whether a procedure was followed.
      - name: Skills declare no authority
        run: python ci/check_skills.py
      # A paper page citing a sibling that exists only on a branch is a dead
      # link on main. That shipped in a pull request once and a reviewer, not
      # a gate, caught it. On a pull_request event actions/checkout checks out
      # the MERGE COMMIT, so the tree here is the state that would land and a
      # plain existence check has merge-result semantics.
      - name: Paper cross-references resolve
        run: python ci/check_paper_citations.py
      # Every evidence citation in the claim ledger must resolve: Lean
      # theorem names against artifacts/lean_axioms.txt, test names
      # against tests/, artifact keys against the committed exports.
      # The population is enumerated independently of the classifier
      # (the check_transport_citations.py discipline), so an
      # unclassifiable token fails totality instead of cancelling out.
      - name: Ledger evidence resolves
        run: python ci/check_ledger_evidence.py
      # Every module UNDER lean4/Derivation/ that is outside Derivation.lean's
      # import closure must be named in lean4/ParkedAudit.lean, which is what
      # emits its axiom reports. The scope clause is load-bearing: a top-level
      # lean4/*.lean is outside this gate's census, outside the
      # elaborated_modules.txt pin, and outside the axiom inventory unless it
      # is a defaultTarget -- ParkedAudit.lean is itself such a file, so it
      # audits every module except itself. An earlier version of this comment
      # said "every module", which is wider than the enforced population.
      #
      # This step also checks that ParkedAudit is still IN defaultTargets and
      # still contributing its pinned number of reports. Without that the
      # whole audit was one word deep: deleting "ParkedAudit" from the
      # lakefile dropped all 48 reports with every other gate green, and the
      # documented repair for the resulting diff would have completed the
      # disable.
      #
      # This is a PYTHON gate rather than a Lean one because the blind spot
      # is only visible from outside Lean: ParkedAudit checks its own list
      # against the compiled environment, but a module nothing imports is
      # absent from that environment, so Lean cannot see that it is missing.
      # Adding a parked module fails the elaborated_modules.txt census pin
      # below -- and the documented repair for THAT is to regenerate the pin,
      # which on its own would leave the module elaborated, pinned, and
      # unaudited. This closes that gap by enumerating from the source tree.
      - name: Parked modules are all named for audit
        run: python ci/check_parked_audit.py
      # Prose-level watchlist census. The identifier firewall in
      # tests/test_primitive_contact.py bars identifiers; it cannot see a
      # docstring, a STATUS page, or a Lean comment carrying an outside noun
      # as if it were a house word. This reads tracked prose against a
      # digest-stored term list and pins every whole-word hit per file,
      # failing in BOTH directions: a hit above its pin names file, line,
      # and token; a hit below it names the stale pin. The terms are digests
      # because CLAUDE.md's refused-grid clause forbids recording outside
      # names by naming them; `--probe WORD` answers whether a word is on
      # the list. It reads prose only: identifiers containing `_` or digits
      # are never split, so they remain the firewall's business.
      - name: Prose watchlist census matches its pin
        run: python ci/check_prose_watchlist.py
      - name: Tests under coverage
        run: |
          coverage run -m pytest -q
          coverage json -q
          coverage report
      - name: Independent 95% line and branch gates
        run: python ci/check_coverage.py
      - name: mypy strict
        run: python -m mypy
      # The runner census is a GLOB, not a hand list. The previous version
      # named all 24 entry points explicitly, so a new code/run_*.py was not
      # regeneration-checked until someone remembered to add it here, and
      # nothing detected the omission.
      #
      # No committed census artifact is needed here, unlike the Lean module
      # census, because artifacts/ IS the pin: ci/compare_artifacts.py walks
      # the COMMITTED directory and reports both directions. A committed
      # artifact with no regeneration - runner renamed, deleted, or dropped
      # from the census - fails as a missing regeneration. A regenerated
      # artifact that was never committed fails too, which is what stops a
      # newly globbed runner from producing output nothing compares.
      #
      # DOMAIN: the top level of code/ only, matching the convention CLAUDE.md
      # documents and the local Get-ChildItem procedure. A runner placed in a
      # SUBDIRECTORY of code/ is NOT enumerated by this census.
      #
      # Execution order is free. The globbed runners were verified to produce
      # byte-identical artifacts under LC_ALL=C order rather than the previous
      # hand order; no runner reads another runner's artifact.
      - name: Regenerate artifacts and compare
        run: |
          set -o pipefail
          find code -maxdepth 1 -name 'run_*.py' \
            | LC_ALL=C sort > /tmp/runners.txt
          if [ ! -s /tmp/runners.txt ]; then
            echo "census enumerated no runners - the enumeration is broken" >&2
            exit 1
          fi
          echo "runner census: $(wc -l < /tmp/runners.txt) entry points"
          while IFS= read -r r; do
            PYTHONPATH=code python "$r" --artifacts artifacts_ci
          done < /tmp/runners.txt
          python ci/compare_artifacts.py artifacts artifacts_ci

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -sSfL \
            https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          for attempt in 1 2 3 4 5 6; do
            sh /tmp/elan-init.sh -y --default-toolchain none && break
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean toolchain
        working-directory: lean4
        run: |
          for attempt in 1 2 3 4 5 6; do
            elan toolchain install "$(cat lean-toolchain)" && break
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: lake build
        working-directory: lean4
        run: |
          set -o pipefail
          lake build 2>&1 | tee ../lake_build.log
      - name: Forbidden-token and axiom audit
        run: python3 ci/check_lean_audit.py lake_build.log
      - name: Axiom report matches committed artifact
        run: python3 ci/check_axiom_report.py lake_build.log
      - name: Axiom artifact regenerates byte-identically (LF, no CRLF)
        run: |
          cp artifacts/lean_axioms.txt /tmp/lean_axioms.committed
          python3 ci/regen_axiom_artifact.py lake_build.log
          diff /tmp/lean_axioms.committed artifacts/lean_axioms.txt
          git diff --check -- artifacts/lean_axioms.txt
      # Must stay LAST in this job and must not write to lake_build.log: the
      # three steps above compare that log against artifacts/lean_axioms.txt.
      # `lake build` only builds defaultTargets, so a module the root does not
      # import is never elaborated and a type error in it merges green.
      #
      # The census is RECURSIVE under Derivation/, so a subdirectory module
      # cannot escape it. It does NOT match ci/check_lean_audit.py's rglob:
      # that reads lean4/**/*.lean while this reads `find Derivation`.
      # The difference is the two top-level roots,
      # lean4/Derivation.lean and lean4/ParkedAudit.lean, which are covered
      # by being defaultTargets rather than by this census -- so a new
      # top-level lean4/*.lean that is NOT a default target would be read
      # only by the plain-text token scan. An earlier version of this comment
      # asserted the two enumerations matched; that is WITHDRAWN.
      #
      # The census is also PINNED against
      # artifacts/elaborated_modules.txt. The pin is what closes partial
      # silence: an empty guard catches a census that finds nothing, but only
      # a diff catches one that finds SOME of the modules. Adding or removing
      # a module fails here until the artifact is regenerated, which makes
      # "every module was elaborated" a checkable receipt rather than a
      # workflow claim. Regenerate with the command in CLAUDE.md.
      - name: Every Lean module elaborates
        working-directory: lean4
        timeout-minutes: 20
        run: |
          set -o pipefail
          find Derivation -name '*.lean' \
            | sed -e 's/\.lean$//' -e 's#/#.#g' \
            | LC_ALL=C sort > /tmp/census.txt
          if [ ! -s /tmp/census.txt ]; then
            echo "census enumerated no modules - the enumeration is broken" >&2
            exit 1
          fi
          echo "source census: $(wc -l < /tmp/census.txt) modules"
          diff ../artifacts/elaborated_modules.txt /tmp/census.txt
          while IFS= read -r m; do
            lake build "$m"
          done < /tmp/census.txt

  # The ELEVENTH gate family, and the only one EXPECTED to go red on a change;
  # that is entirely legitimate. Read the next three paragraphs before
  # reacting to a failure here.
  #
  # It was the tenth until ci/check_parked_audit.py took that number. The
  # numbering is shared with CLAUDE.md, and leaving this comment at TENTH
  # pointed "expected to go red" at the parked-module gate, which is not
  # expected to go red and has a completely different repair.
  #
  # research/ is outside the sealed boundary. Before this job landed, its
  # verifiers were manual receipts and no workflow job read that tree. The
  # cost of that was paid on 2026-08-21: merging #76 and #77 left main with
  # five failing research tests while this workflow reported SUCCESS: #77
  # edited a module that SOURCE_MANIFEST.json pins by SHA-256, #76 shipped
  # the tests that read the pin, and the two only interact once both are
  # present. Every gate was green and the repository was broken.
  #
  # This job makes that drift VISIBLE. It does not decide whether drift
  # BLOCKS -- that is branch protection, and it is the author's policy call.
  # A sealed pull request that edits a module pinned in the manifest SHOULD
  # show this job red. That is the signal to repin, not a defect in the PR,
  # and it is the coupling that kept this tree out of CI in the first place.
  # The repair is `verify_manifest.py --repin` followed by the prose revision
  # it demands; review a repin by diffing the PARSED json, because --repin
  # re-serializes and rewrites far more lines than it changes values.
  #
  # NOT run here: verify_lean.py. It builds the research Lake package, which
  # needs elan and compiles the sealed package as a dependency -- exactly the
  # expense this job exists to avoid. The research tree's AXIOMS therefore
  # remain a manual receipt, unchecked by any gate. Do not read a green run
  # here as covering them.
  research:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene. verify_manifest.py walks
      # history from the pinned snapshot with --full-history and resolves
      # canonical git blobs; the default shallow checkout makes both silently
      # unavailable, which would turn this gate into a green no-op.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Research source pins match the sealed blobs
        run: python research/primitive_difference_tower/verify_manifest.py
      - name: Research tree tests
        working-directory: research/primitive_difference_tower
        run: python -m unittest discover -s . -p "test_*.py"
      - name: Research tree strict typing
        working-directory: research/primitive_difference_tower
        run: python -m mypy
      # The export surface is pinned the same way and for the same reason.
      # Its second check is the one the sibling tree lacks: every exported
      # name must actually be DECLARED in the module it is attributed to,
      # so the interface cannot cite a theorem that was renamed away. A
      # hash pin proves the source did not move; it does not prove the
      # document names anything real.
      - name: Portable interface pins and exports resolve
        run: python research/portable_interface/verify_pins.py
      - name: Portable interface tests
        working-directory: research/portable_interface
        run: python -m unittest discover -s . -p "test_*.py"
      - name: Portable interface strict typing
        working-directory: research/portable_interface
        run: python -m mypy
      # The blind-restart kernel is pinned to the artifacts its scoring
      # key reads, and its third check is unlike either sibling's: it
      # proves the prompt does not contain the answers. A staged prompt
      # that states its own expected results is a leading question, and a
      # solver agreeing with it is not evidence. Nothing here runs a
      # solver or gates on one -- a reply is outside the machine.
      - name: Blind restart pins, key resolution, and leak gate
        run: python research/blind_restart/verify_pins.py
      - name: Blind restart tests
        working-directory: research/blind_restart
        run: python -m unittest discover -s . -p "test_*.py"
      - name: Blind restart strict typing
        working-directory: research/blind_restart
        run: python -m mypy
      # Partial Decide is a recorder over the already declared bounded
      # candidate computation. Its source/import verifier is load-bearing:
      # without it a new engine or panel import could silently widen the
      # syntactic/provenance surface this package explicitly declares.
      - name: Partial Decide pins, imports, and receipt
        run: python research/partial_decide/verify_pins.py
        env:
          PYTHONPATH: ${{ github.workspace }}/code
      - name: Partial Decide tests
        working-directory: research/partial_decide
        run: python -m unittest discover -s . -p "test_*.py"
        env:
          PYTHONPATH: ${{ github.workspace }}/code
      - name: Partial Decide strict typing
        working-directory: research/partial_decide
        run: python -m mypy
        env:
          PYTHONPATH: ${{ github.workspace }}/code
      # The second derivation registers every rung here, so that no rung
      # is a manual receipt (research/second/SEED.md, section 10).  Rung
      # zero replays the inheritance; its verifier also checks that the
      # seed and the rung's frozen texts have not moved.
      - name: Second derivation, rung 0, pins and frozen texts
        run: python research/second_inheritance/verify_pins.py
      - name: Second derivation, rung 0, tests
        working-directory: research/second_inheritance
        run: python -m unittest discover -s . -p "test_*.py"
      - name: Second derivation, rung 0, strict typing
        working-directory: research/second_inheritance
        run: python -m mypy
