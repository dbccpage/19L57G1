name: Local reuse proofs and counterexamples

on:
  pull_request:
    paths:
      - 'research/local_reuse/**'
      - '.github/workflows/local-reuse.yml'
      - 'code/**'
      - 'lean4/**'
      - 'prompt/**'
      - 'paper/**'
      - 'artifacts/**'
      - 'requirements.txt'
  push:
    branches: [main]
    paths:
      - 'research/local_reuse/**'
      - '.github/workflows/local-reuse.yml'
      - 'code/**'
      - 'lean4/**'
      - 'prompt/**'
      - 'paper/**'
      - 'artifacts/**'
      - 'requirements.txt'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}/code

jobs:
  computation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt pytest-xdist==3.8.0
      - name: Source identity and original-engine evidence
        working-directory: research/local_reuse
        run: |
          python verify_sources.py --check
          python run.py --check
      - name: Counterexamples and mutation tests
        working-directory: research/local_reuse
        run: python -m pytest -n 8 -q tests -p no:cacheprovider --basetemp "$RUNNER_TEMP/local-reuse-tests"
      - name: Strict typing
        working-directory: research/local_reuse
        run: python -m mypy --config-file pyproject.toml
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the declared proof toolchain
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -sSfL https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat research/local_reuse/lean/lean-toolchain)"
      - name: Fresh proofs, independent theorem census and reliance audit
        working-directory: research/local_reuse
        run: python verify_lean.py --check
