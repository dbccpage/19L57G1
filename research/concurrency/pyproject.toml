[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "concurrency"
version = "0.1.0"
description = "Multi-locus product carriers, interaction graphs, and observer exchange"
readme = "README.md"
