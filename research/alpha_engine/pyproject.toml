[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../code"]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
strict = true
files = [
  "harness.py",
  "evaluate.py",
  "proposer.py",
  "search_policy.py",
  "driver_a.py",
  "run.py",
  "verify.py",
  "verify_sources.py",
  "verify_lean.py",
  "check_coverage.py",
  "tests",
]
mypy_path = ".:../../code"
explicit_package_bases = true

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "lean/*", ".lake/*", "verify.py", "verify_lean.py", "verify_sources.py", "run.py"]

[tool.coverage.report]
# fail_under is not used: coverage.py's percent_covered mixes statements
# and branches.  check_coverage.py enforces 95% of each independently.
show_missing = true
