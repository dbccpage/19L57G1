name = "ignition"
version = "0.1.0"
defaultTargets = ["Ignition", "Inventory", "Driver"]

# The sealed derivation package, consumed read-only.
[[require]]
name = "derivation"
path = "../../../lean4"

# The merged replay-cut theorems (replayE_suffix, delta_replays,
# round_replays) of the local_reuse family, consumed read-only rather than
# re-proved under new names.
[[require]]
name = "local_reuse"
path = "../../local_reuse/lean"

[[lean_lib]]
name = "Ignition"

[[lean_lib]]
name = "Inventory"

[[lean_lib]]
name = "Driver"
